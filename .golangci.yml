version: "2"

run:
  concurrency: 4
  tests: true

linters:
  enable:
    - dupl
    - exhaustive
    - funlen
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 100
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 80
      statements: 100
    gocritic:
      enabled-checks:
        - hugeParam
        - importShadow
        - paramTypeCombine
        - stringXbytes
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: error

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$